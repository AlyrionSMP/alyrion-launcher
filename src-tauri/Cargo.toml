[package]
name = "alyrion-launcher"
version = "1.0.0"
description = "Alyrion Launcher — all-in-one launcher for the Alyrion VII modpack (locked to the latest version, auto-updating)."
authors = ["Alyrion Launcher"]
edition = "2021"
default-run = "alyrion-launcher"

[lib]
name = "alyrion_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip"] }
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
zip = { version = "4", default-features = false, features = ["deflate", "deflate64"] }
regex = "1"
once_cell = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
futures-util = "0.3"
md5 = "0.7"

[features]
custom-protocol = ["tauri/custom-protocol"]
